<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alumnos - IPET 1308</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mb-3">← Volver al Menú Principal</a>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>👥 Listado de Alumnos</h2>
            <a href="{% url 'agregar_alumno' %}" class="btn btn-success">+ Nuevo Alumno</a>
        </div>
        <table class="table table-striped bg-white shadow-sm rounded">
            <thead class="table-dark">
                <tr><th>Apellido</th><th>Nombre</th><th>Código QR ID</th></tr>
            </thead>
            <tbody>
                {% for alumno in alumnos %}
                <tr>
                    <td>{{ alumno.apellido }}</td>
                    <td>{{ alumno.nombre }}</td>
                    <td><code>{{ alumno.codigo_identificador }}</code></td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center">No hay alumnos cargados.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
