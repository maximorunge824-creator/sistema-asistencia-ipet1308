<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte Diario - IPET 1308</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mb-3">← Volver al Menú Principal</a>
        <h2 class="text-primary mb-3">📊 Reporte de Asistencia: {{ fecha_consulta }}</h2>
        
        <form method="get" class="row g-3 mb-4">
            <div class="col-auto">
                <input type="date" name="fecha" value="{{ fecha_str }}" class="form-control">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Consultar Fecha</button>
            </div>
        </form>

        {% if mensaje_calendario %}
            <div class="alert alert-warning">{{ mensaje_calendario }}</div>
        {% endif %}

        <div class="row text-center mb-4">
            <div class="col-md-4"><div class="card p-3 bg-success text-white"><h4>{{ presentes|length }}</h4> Presentes</div></div>
            <div class="col-md-4"><div class="card p-3 bg-warning text-dark"><h4>{{ tardes|length }}</h4> Tarde</div></div>
            <div class="col-md-4"><div class="card p-3 bg-danger text-white"><h4>{{ ausentes|length }}</h4> Ausentes</div></div>
        </div>
        
        <div class="card p-3 shadow-sm bg-white">
            <h4>Porcentaje de Asistencia: {{ porcentaje }}%</h4>
        </div>
    </div>
</body>
</html>
